<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans CJK TC','Comic Sans MS','Marker Felt',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="halftone" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#FFE8A3"/>
      <circle cx="13" cy="13" r="6" fill="#FFD23F"/>
    </pattern>
    <pattern id="halftonePink" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none"/>
      <circle cx="10" cy="10" r="4.5" fill="#FF6F91" opacity="0.55"/>
    </pattern>
    <radialGradient id="burst" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="100%" stop-color="#FFD23F"/>
    </radialGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1B1B1B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- comic paper background -->
  <rect width="900" height="1000" fill="url(#halftone)"/>

  <!-- action speed lines radiating from top-left corner -->
  <g stroke="#1B1B1B" stroke-width="3" opacity="0.15">
    <line x1="0" y1="0" x2="260" y2="0"/>
    <line x1="0" y1="0" x2="0" y2="220"/>
    <line x1="0" y1="0" x2="200" y2="130"/>
    <line x1="0" y1="0" x2="130" y2="200"/>
  </g>

  <!-- starburst behind header -->
  <g transform="translate(450,110)">
    <path d="M0,-160 L20,-45 L140,-70 L40,0 L140,70 L20,45 L0,160 L-20,45 L-140,70 L-40,0 L-140,-70 L-20,-45 Z"
          fill="url(#burst)" stroke="#1B1B1B" stroke-width="4" opacity="0.9"/>
  </g>

  <!-- floating comic dots decoration -->
  <circle cx="90" cy="850" r="22" fill="#FF6F91" stroke="#1B1B1B" stroke-width="3"/>
  <circle cx="140" cy="900" r="10" fill="#4DCCBD" stroke="#1B1B1B" stroke-width="2"/>
  <circle cx="820" cy="180" r="14" fill="#4DCCBD" stroke="#1B1B1B" stroke-width="2"/>
  <circle cx="800" cy="900" r="26" fill="#FFD23F" stroke="#1B1B1B" stroke-width="3"/>

  <!-- speech bubble top-right: app tagline -->
  <g transform="translate(660,40)" filter="url(#softshadow)">
    <path d="M10,10 h190 a14,14 0 0 1 14,14 v58 a14,14 0 0 1 -14,14 h-120 l-28,26 6,-26 h-48 a14,14 0 0 1 -14,-14 v-58 a14,14 0 0 1 14,-14 Z"
          fill="#FFFFFF" stroke="#1B1B1B" stroke-width="4"/>
    <text x="105" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#1B1B1B">揪起來！</text>
    <text x="105" y="78" text-anchor="middle" font-size="14" fill="#555">大家一起選日子</text>
  </g>

  <!-- ===================== PHONE FRAME ===================== -->
  <g transform="translate(190,60)">
    <rect x="-14" y="-14" width="548" height="900" rx="46" fill="#1B1B1B"/>
    <rect x="0" y="0" width="520" height="872" rx="34" fill="#FFF8E7"/>

    <!-- status bar -->
    <text x="260" y="34" text-anchor="middle" font-size="16" fill="#1B1B1B" font-weight="700">9:41</text>

    <!-- App header banner -->
    <g transform="translate(0,50)">
      <rect x="18" y="0" width="484" height="118" rx="24" fill="#FF6F91" stroke="#1B1B1B" stroke-width="5"/>
      <rect x="18" y="0" width="484" height="118" rx="24" fill="url(#halftonePink)"/>
      <text x="46" y="56" font-size="42" font-weight="800" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="1.5">揪咖 JioKa</text>
      <text x="46" y="88" font-size="18" fill="#FFF3F6">週末爬山團 · 揪團排程小工具</text>
      <!-- avatar stack -->
      <circle cx="430" cy="55" r="20" fill="#FFD23F" stroke="#1B1B1B" stroke-width="3"/>
      <circle cx="452" cy="55" r="20" fill="#4DCCBD" stroke="#1B1B1B" stroke-width="3"/>
      <circle cx="474" cy="55" r="20" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="3"/>
      <text x="474" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#1B1B1B">+5</text>
    </g>

    <!-- Section label: 選日期 -->
    <g transform="translate(18,196)">
      <rect x="0" y="0" width="150" height="40" rx="20" fill="#FFD23F" stroke="#1B1B1B" stroke-width="3"/>
      <text x="75" y="27" text-anchor="middle" font-size="19" font-weight="700" fill="#1B1B1B">選日期</text>
    </g>

    <!-- Calendar card -->
    <g transform="translate(18,248)">
      <rect x="0" y="0" width="484" height="300" rx="22" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="5" filter="url(#softshadow)"/>
      <text x="242" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1B1B">2026 年 9 月</text>

      <!-- weekday row -->
      <g font-size="14" fill="#888" text-anchor="middle" font-weight="700">
        <text x="52" y="70">日</text><text x="121" y="70">一</text><text x="190" y="70">二</text>
        <text x="259" y="70">三</text><text x="328" y="70">四</text><text x="397" y="70">五</text><text x="466" y="70">六</text>
      </g>

      <!-- calendar grid cells (heat-map style, comic outline) -->
      <!-- row 1 -->
      <g font-size="16" font-weight="700" text-anchor="middle">
        <circle cx="121" cy="108" r="24" fill="#FFE39A" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="121" y="114" fill="#1B1B1B">1</text>
        <circle cx="190" cy="108" r="24" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="190" y="114" fill="#1B1B1B">2</text>
        <circle cx="259" cy="108" r="26" fill="#FF9F43" stroke="#1B1B1B" stroke-width="3"/>
        <text x="259" y="114" fill="#1B1B1B">3</text>
        <circle cx="328" cy="108" r="24" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="328" y="114" fill="#1B1B1B">4</text>

        <!-- winning day: comic star burst -->
        <path transform="translate(397,108)" d="M0,-34 L9,-11 L34,-11 L14,4 L21,29 L0,14 L-21,29 L-14,4 L-34,-11 L-9,-11 Z"
              fill="#FF6F91" stroke="#1B1B1B" stroke-width="3"/>
        <text x="397" y="114" fill="#FFFFFF">5</text>

        <circle cx="466" cy="108" r="24" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="466" y="114" fill="#1B1B1B">6</text>
      </g>

      <!-- row 2 -->
      <g font-size="16" font-weight="700" text-anchor="middle">
        <circle cx="52" cy="166" r="24" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="52" y="172" fill="#1B1B1B">7</text>
        <circle cx="121" cy="166" r="24" fill="#FFE39A" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="121" y="172" fill="#1B1B1B">8</text>
        <circle cx="190" cy="166" r="24" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="190" y="172" fill="#1B1B1B">9</text>
        <circle cx="259" cy="166" r="24" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="259" y="172" fill="#1B1B1B">10</text>
        <circle cx="328" cy="166" r="24" fill="#FFE39A" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="328" y="172" fill="#1B1B1B">11</text>
        <circle cx="397" cy="166" r="24" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="397" y="172" fill="#1B1B1B">12</text>
        <circle cx="466" cy="166" r="24" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2.5"/>
        <text x="466" y="172" fill="#1B1B1B">13</text>
      </g>

      <!-- legend -->
      <g transform="translate(30,222)" font-size="13" fill="#555">
        <circle cx="6" cy="0" r="7" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="2"/>
        <text x="20" y="4">0人</text>
        <circle cx="76" cy="0" r="7" fill="#FFE39A" stroke="#1B1B1B" stroke-width="2"/>
        <text x="90" y="4">少數</text>
        <circle cx="156" cy="0" r="7" fill="#FF9F43" stroke="#1B1B1B" stroke-width="2"/>
        <text x="170" y="4">過半</text>
        <path transform="translate(236,0) scale(0.22)" d="M0,-34 L9,-11 L34,-11 L14,4 L21,29 L0,14 L-21,29 L-14,4 L-34,-11 L-9,-11 Z" fill="#FF6F91" stroke="#1B1B1B" stroke-width="6"/>
        <text x="250" y="4">全員 OK！</text>
      </g>

      <text x="242" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#1B1B1B">9/5 目前全員可以，領先中！</text>
    </g>

    <!-- Section label: 選地點 -->
    <g transform="translate(18,566)">
      <rect x="0" y="0" width="150" height="40" rx="20" fill="#4DCCBD" stroke="#1B1B1B" stroke-width="3"/>
      <text x="75" y="27" text-anchor="middle" font-size="19" font-weight="700" fill="#1B1B1B">選地點</text>
    </g>

    <!-- location cards -->
    <g transform="translate(18,618)">
      <rect x="0" y="0" width="484" height="86" rx="18" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="4"/>
      <circle cx="46" cy="43" r="26" fill="#4DCCBD" stroke="#1B1B1B" stroke-width="3"/>
      <text x="46" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1B1B">麵</text>
      <text x="88" y="36" font-size="18" font-weight="700" fill="#1B1B1B">貓空茶屋</text>
      <text x="88" y="58" font-size="13" fill="#777">Google 地圖 →</text>
      <rect x="386" y="20" width="80" height="46" rx="23" fill="#FFD23F" stroke="#1B1B1B" stroke-width="3"/>
      <text x="426" y="49" text-anchor="middle" font-size="16" font-weight="700" fill="#1B1B1B">我可以</text>
    </g>
    <g transform="translate(18,714)">
      <rect x="0" y="0" width="484" height="86" rx="18" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="4"/>
      <circle cx="46" cy="43" r="26" fill="#FF6F91" stroke="#1B1B1B" stroke-width="3"/>
      <text x="46" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1B1B">鍋</text>
      <text x="88" y="36" font-size="18" font-weight="700" fill="#1B1B1B">深坑老街</text>
      <text x="88" y="58" font-size="13" fill="#777">Google 地圖 →</text>
      <rect x="386" y="20" width="80" height="46" rx="23" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="3"/>
      <text x="426" y="49" text-anchor="middle" font-size="16" font-weight="700" fill="#1B1B1B">我可以</text>
    </g>

    <!-- comment bubble section -->
    <g transform="translate(18,814)">
      <path d="M14,0 h456 a14,14 0 0 1 14,14 v20 a14,14 0 0 1 -14,14 h-330 l-24,20 4,-20 h-136 a14,14 0 0 1 -14,-14 v-20 a14,14 0 0 1 14,-14 Z"
            fill="#FFFFFF" stroke="#1B1B1B" stroke-width="3.5"/>
      <text x="36" y="26" font-size="15" fill="#1B1B1B">阿翔：貓空那間週末很多人，建議先訂位喔！</text>
    </g>

    <!-- floating add button (add new option) -->
    <g transform="translate(478,586)">
      <circle r="26" fill="#FF6F91" stroke="#1B1B1B" stroke-width="4" filter="url(#softshadow)"/>
      <text x="0" y="8" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF">+</text>
    </g>
  </g>

  <!-- bottom caption -->
  <text x="450" y="978" text-anchor="middle" font-size="16" fill="#1B1B1B" font-weight="700" opacity="0.7">揪咖 JioKa — 揪團排程小工具　UI 示意稿</text>
</svg>
